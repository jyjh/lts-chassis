name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  matlab-tests:
    runs-on: ubuntu-latest
    # Free MATLAB on GitHub-hosted runners requires this repository to be
    # public. For a private repository, provide a license server or use a
    # self-hosted runner before enabling this workflow.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Run component tests
        uses: matlab-actions/run-command@v3
        with:
          command: run_tests
